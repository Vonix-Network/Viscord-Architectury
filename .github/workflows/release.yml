name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.asset_name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: 'viscord-1.18.2-fabric-forge-template', loader: 'fabric', jdk: '21', gradle: '8.14', asset_name: 'viscord-1.18.2-fabric', pattern: 'viscord-fabric-*.jar' }
          - { project: 'viscord-1.18.2-fabric-forge-template', loader: 'forge', jdk: '21', gradle: '8.14', asset_name: 'viscord-1.18.2-forge', pattern: 'viscord-forge-*.jar' }
          - { project: 'viscord-1.19.2-fabric-forge-template', loader: 'fabric', jdk: '21', gradle: '8.14', asset_name: 'viscord-1.19.2-fabric', pattern: 'viscord-fabric-*.jar' }
          - { project: 'viscord-1.19.2-fabric-forge-template', loader: 'forge', jdk: '21', gradle: '8.14', asset_name: 'viscord-1.19.2-forge', pattern: 'viscord-forge-*.jar' }
          - { project: 'viscord-1.20.1-fabric-forge-template', loader: 'fabric', jdk: '21', gradle: '8.14', asset_name: 'viscord-1.20.1-fabric', pattern: 'viscord-fabric-*.jar' }
          - { project: 'viscord-1.20.1-fabric-forge-template', loader: 'forge', jdk: '21', gradle: '8.14', asset_name: 'viscord-1.20.1-forge', pattern: 'viscord-forge-*.jar' }
          - { project: 'viscord-1.21.1-fabric-neoforge-template', loader: 'fabric', jdk: '21', gradle: '8.14', asset_name: 'viscord-1.21.1-fabric', pattern: 'viscord-fabric-*.jar' }
          - { project: 'viscord-1.21.1-fabric-neoforge-template', loader: 'neoforge', jdk: '21', gradle: '8.14', asset_name: 'viscord-1.21.1-neoforge', pattern: 'viscord-neoforge-*.jar' }
          - { project: 'viscord-1.26.1.2-neoforge-target', loader: 'neoforge', jdk: '25', gradle: '9.2.0', asset_name: 'viscord-26.1.2-neoforge', pattern: 'viscord-*.jar' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ matrix.gradle }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-release-${{ matrix.asset_name }}-${{ hashFiles(format('{0}/**/*.gradle*', matrix.project), format('{0}/gradle.properties', matrix.project)) }}
      - name: Build ${{ matrix.loader }}
        working-directory: ${{ matrix.project }}
        run: gradle build --no-daemon
      - name: Select release jar
        id: jar
        working-directory: ${{ matrix.project }}
        env:
          JAR_PATTERN: ${{ matrix.pattern }}
        run: |
          set -euo pipefail
          JAR="$(find . -type f -path '*/build/libs/*.jar' -name "$JAR_PATTERN" ! -name '*sources*' ! -name '*dev*' ! -name '*shadow*' ! -name '*slim*' | head -n 1)"
          test -n "$JAR"
          if [ "${{ matrix.project }}" != "viscord-1.26.1.2-neoforge-target" ]; then
            if ! jar tf "$JAR" | grep -Fxq 'network/vonix/viscord/shadow/javacord/api/entity/message/MessageBuilderBase.class'; then
              echo "Required relocated Javacord MessageBuilderBase.class is missing from $JAR"
              exit 1
            fi
          fi
          mkdir -p "$RUNNER_TEMP/release"
          cp "$JAR" "$RUNNER_TEMP/release/${{ matrix.asset_name }}.jar"
          echo "path=$RUNNER_TEMP/release/${{ matrix.asset_name }}.jar" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.asset_name }}
          path: ${{ steps.jar.outputs.path }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: jar-*
          merge-multiple: true
      - name: Stage assets and checksums
        run: |
          set -euo pipefail
          mkdir -p release
          find dist -type f -name '*.jar' -exec cp {} release/ \;
          test "$(find release -maxdepth 1 -name '*.jar' | wc -l)" -eq 9
          (cd release && sha256sum *.jar > SHA256SUMS)
      - name: Write release notes
        run: |
          set -euo pipefail
          {
            echo "## Viscord ${GITHUB_REF_NAME}"
            echo
            echo "Common-generation stable release 5.0.0. All nine supported Minecraft/loader lanes are built by GitHub Actions from this tag."
            echo
            echo "### Artifact matrix"
            echo
            echo "The release contains one matching jar for each supported lane: 1.18.2 Fabric/Forge, 1.19.2 Fabric/Forge, 1.20.1 Fabric/Forge, 1.21.1 Fabric/NeoForge, and 26.1.2 NeoForge."
            echo
            echo "### Included with this release"
            echo
            echo "The release includes the CI-built jars for all nine supported lanes and a SHA-256 checksum file named SHA256SUMS."
          } > release/RELEASE-NOTES.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release/RELEASE-NOTES.md
          files: |
            release/*.jar
            release/SHA256SUMS
          draft: false
          prerelease: false
